<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Верхний тёплый янтарно-оранжевый градиент (отсылка к исходной иконке Notify Mod) -->
    <linearGradient id="bgGradient" x1="0" y1="20" x2="0" y2="704" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#D9530A"/>
    </linearGradient>

    <!-- Векторный колокольчик с язычком (построен вручную кривыми Безье) -->
    <g id="bellShape">
      <!-- Верхнее ушко -->
      <rect x="-25" y="-202" width="50" height="50" rx="25"/>
      <!-- Купол и расклешённая юбка колокольчика -->
      <path d="M 0 -172
               C 72 -172, 114 -120, 114 -48
               L 114 26
               C 114 68, 134 94, 158 112
               C 167 119, 170 128, 166 138
               C 162 146, 154 150, 144 150
               L -144 150
               C -154 150, -162 146, -166 138
               C -170 128, -167 119, -158 112
               C -134 94, -114 68, -114 26
               L -114 -48
               C -114 -120, -72 -172, 0 -172 Z"/>
      <!-- Язычок с чистым зазором -->
      <path d="M -46 170
               L 46 170
               C 46 198, 25 218, 0 218
               C -25 218, -46 198, -46 170 Z"/>
    </g>

    <!-- Две жирные звуковые дуги уведомления -->
    <g id="signalWaves" fill="none" stroke-width="29" stroke-linecap="round">
      <path d="M 103.4 -176.8 A 98 98 0 0 1 159.6 -79.5"/>
      <path d="M 122.2 -229.8 A 154 154 0 0 1 214.9 -69.2"/>
    </g>
  </defs>

  <!-- Тёмно-графитовая рамка и нижняя волновая основа -->
  <rect width="1024" height="1024" fill="#12151C"/>

  <!-- Верхняя градиентная панель с плавной S-образной нижней волной -->
  <path d="M 20 20
           L 1004 20
           L 1004 674
           C 860 712, 660 712, 512 674
           C 364 636, 164 636, 20 674
           Z"
        fill="url(#bgGradient)"/>

  <!-- Жёсткая плоская векторная тень со смещением вправо-вниз (без размытия, в стиле 2-й иконки) -->
  <g transform="translate(496, 404) rotate(-13) scale(1.06)" fill="#8E2E02" stroke="#8E2E02">
    <use href="#bellShape" stroke="none"/>
    <use href="#signalWaves"/>
  </g>

  <!-- Основной чисто-белый наклонённый колокольчик со звуковыми волнами -->
  <g transform="translate(478, 384) rotate(-13) scale(1.06)" fill="#FFFFFF" stroke="#FFFFFF">
    <use href="#bellShape" stroke="none"/>
    <use href="#signalWaves"/>
  </g>

  <!-- Нижняя акцентная зона: горизонтальные направляющие и значок чат-сообщения -->
  <g fill="none" stroke="#FF961F" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <line x1="96" y1="852" x2="334" y2="852"/>
    <line x1="690" y1="852" x2="928" y2="852"/>
    <path d="M 442 776
             L 582 776
             A 40 40 0 0 1 622 816
             L 622 880
             A 40 40 0 0 1 582 920
             L 462 920
             L 402 948
             L 402 816
             A 40 40 0 0 1 442 776 Z"/>
  </g>
  <g fill="#FF961F">
    <circle cx="464" cy="848" r="16"/>
    <circle cx="512" cy="848" r="16"/>
    <circle cx="560" cy="848" r="16"/>
  </g>
</svg>
